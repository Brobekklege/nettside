<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero v2 · 03 — Variable Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.17 0.012 45);--bg-2:oklch(0.21 0.014 45);
  --ink:oklch(0.96 0.008 70);--muted:oklch(0.74 0.016 55);--faint:oklch(0.56 0.016 55);
  --accent:oklch(0.72 0.17 42);--accent-bright:oklch(0.81 0.16 52);--line:oklch(0.32 0.012 45);
  --ease:cubic-bezier(0.16,1,0.3,1);--font:"Geist",system-ui,sans-serif;--mono:"Geist Mono",monospace;
}
:root{color-scheme:dark}*{margin:0;padding:0;box-sizing:border-box}a,.btn,.npill,.nlinks a{touch-action:manipulation}h1{text-wrap:balance}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.hero{position:relative;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(70% 60% at 50% 38%,var(--bg-2),var(--bg))}
.dots{position:absolute;inset:0;z-index:0;background-image:radial-gradient(oklch(0.32 0.012 45 / .5) 1px,transparent 1px);background-size:30px 30px;mask:radial-gradient(70% 60% at 50% 42%,#000,transparent 78%);-webkit-mask:radial-gradient(70% 60% at 50% 42%,#000,transparent 78%)}

nav{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:26px clamp(22px,5vw,60px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.bm{width:31px;height:31px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--bg)}
.bm svg{width:17px;height:17px}
.nlinks{display:flex;gap:4px}
.nlinks a{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding:9px 13px;border-radius:8px;min-height:40px;display:inline-flex;align-items:center;transition:color .2s var(--ease),background .2s var(--ease)}
.nlinks a:hover{color:var(--ink);background:oklch(0.26 0.012 45)}
.npill{font-weight:500;font-size:14px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;min-height:44px;display:inline-flex;align-items:center;transition:transform .16s var(--ease),background .2s}
.npill:hover{background:var(--accent)}.npill:active{transform:scale(.97)}
@media(max-width:820px){.nlinks{display:none}}

.stage{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 24px 56px;width:100%}
.kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--accent-bright);margin-bottom:26px;opacity:0;animation:fade .9s var(--ease) .15s forwards}
.kicker .pip{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:ping 2.6s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 oklch(0.72 0.17 42 / .5)}70%,100%{box-shadow:0 0 0 11px oklch(0.72 0.17 42 / 0)}}
h1{margin:0;line-height:.92;letter-spacing:-.05em;font-size:clamp(3.4rem,13vw,10rem)}
h1 .row{display:block}
h1 .ch{display:inline-block;font-variation-settings:"wght" 120;font-weight:120;color:var(--ink);transition:font-variation-settings .55s var(--ease),color .35s var(--ease);will-change:font-variation-settings}
h1 .ch.sp{width:.26em}
.lead{margin-top:30px;font-size:1.14rem;line-height:1.55;color:var(--muted);max-width:46ch;opacity:0;animation:fade 1s var(--ease) .85s forwards}
@keyframes fade{to{opacity:1}}
.cta{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fade 1s var(--ease) 1s forwards}
.btn{display:inline-flex;align-items:center;gap:9px;font-weight:500;font-size:15px;padding:14px 24px;border-radius:11px;cursor:pointer;min-height:48px;transition:transform .16s var(--ease),background .2s,box-shadow .3s var(--ease);border:1px solid transparent}
.btn svg{width:16px;height:16px}
.b-acc{background:var(--accent);color:var(--bg);box-shadow:0 14px 40px -16px var(--accent)}
.b-acc:hover{background:var(--accent-bright)}.b-acc:active{transform:scale(.98)}
.b-gh{background:transparent;color:var(--ink);border-color:var(--line)}
.b-gh:hover{border-color:var(--accent);color:var(--accent-bright)}.b-gh:active{transform:scale(.98)}
.hint{margin-top:40px;font-family:var(--mono);font-size:11.5px;color:var(--faint);opacity:0;animation:fade 1s var(--ease) 1.2s forwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.kicker,.lead,.cta,.hint{opacity:1}h1 .ch{font-variation-settings:"wght" 560;font-weight:560}}
</style>
</head>
<body>
<section class="hero">
  <div class="dots"></div>
  <nav>
    <a href="#" class="brand" aria-label="Brobekk Legekontor, til forsiden"><span class="bm" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>Brobekk Legekontor</a>
    <div class="nlinks"><a href="#">helsenorge</a><a href="#">tjenester</a><a href="#">leger</a><a href="#">om</a></div>
    <a href="#" class="npill">Bestill time</a>
  </nav>
  <div class="stage">
    <span class="kicker"><span class="pip"></span>FASTLEGE · LINDERUD · OSLO</span>
    <h1 id="kt" aria-label="Helt nær. Helt din.">
      <span class="row" data-t="Helt nær."></span>
      <span class="row" data-t="Helt din."></span>
    </h1>
    <p class="lead">To spesialister i allmennmedisin som kjenner deg. Beveg pekeren over teksten.</p>
    <div class="cta">
      <a href="#" class="btn b-acc">Bestill time på Helsenorge <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></a>
      <a href="#" class="btn b-gh">Kontakt oss</a>
    </div>
    <p class="hint">Man til fre 08:00–15:00 · Telefontid 09–11 / 13–14 · Plan 3</p>
  </div>
</section>
<script>
(function(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const h1=document.getElementById('kt');
  const chars=[];
  h1.querySelectorAll('.row').forEach(row=>{
    [...row.dataset.t].forEach(c=>{
      const s=document.createElement('span');
      s.className='ch'+(c===' '?' sp':'');
      s.textContent=c===' '?'':c;
      row.appendChild(s);
      if(c!==' ')chars.push(s);
    });
  });
  if(reduce)return;
  // load wave
  chars.forEach((s,i)=>setTimeout(()=>{s.style.fontVariationSettings='"wght" 560';s.style.fontWeight='560';},250+i*45));
  // cursor proximity weight
  let raf;
  function onMove(e){
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      for(const s of chars){
        const r=s.getBoundingClientRect();
        const cx=r.left+r.width/2,cy=r.top+r.height/2;
        const d=Math.hypot(e.clientX-cx,e.clientY-cy);
        const w=Math.round(Math.max(300,900-d*1.4));
        s.style.fontVariationSettings='"wght" '+w;
        s.style.fontWeight=w;
        s.style.color = d<120 ? 'var(--accent-bright)' : 'var(--ink)';
      }
    });
  }
  window.addEventListener('pointermove',onMove,{passive:true});
  window.addEventListener('pointerleave',()=>{chars.forEach(s=>{s.style.fontVariationSettings='"wght" 560';s.style.fontWeight=560;s.style.color='var(--ink)';});});
})();
</script>
</body>
</html>
